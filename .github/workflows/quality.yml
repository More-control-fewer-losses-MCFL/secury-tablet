name: Quality

on:
  push:
    branches: [main, develop, deploy/render]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install --no-deps -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/unit -q

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: armario_tablets_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-only-password@127.0.0.1:3306/armario_tablets_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - run: python -m pip install --no-deps -r requirements.lock -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/integration -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

  docker:
    runs-on: ubuntu-latest
    needs: [unit, mysql, flutter]
    timeout-minutes: 25
    env:
      MYSQL_DATABASE: armario_tablets
      MYSQL_USER: armario
      MYSQL_PASSWORD: ci-only-app-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-administrator-password
      ADMIN_TOKEN_SECRET: ci-only-signing-secret-with-at-least-32-bytes
      HARDWARE_API_KEY: ci-only-hardware-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Verify cold MySQL authentication and migrations
        run: |
          set -euo pipefail
          export MYSQL_DATABASE=render_auth_test
          export MYSQL_USER=render_auth_ci
          export MYSQL_PASSWORD="$(openssl rand -hex 24)"
          export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
          export MYSQL_HOST=render_auth_db
          docker build -f docker/api.Dockerfile -t secury-tablet-api:cold-auth .
          docker network create render_auth_net >/dev/null
          cleanup() {
            docker rm -f render_auth_db >/dev/null 2>&1 || true
            docker network rm render_auth_net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name render_auth_db --network render_auth_net \
            -e MYSQL_DATABASE -e MYSQL_USER -e MYSQL_PASSWORD -e MYSQL_ROOT_PASSWORD \
            mysql:8.4 >/dev/null
          wait_mysql() {
            for attempt in $(seq 1 60); do
              if docker exec render_auth_db sh -c \
                'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent' \
                >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo 'isolated MySQL did not become ready' >&2
            return 1
          }
          wait_mysql
          plugin=$(printf "SELECT plugin FROM mysql.user WHERE user='render_auth_ci';\n" |
            docker exec -i render_auth_db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N')
          test "$plugin" = caching_sha2_password
          docker run --rm --network render_auth_net \
            -e MYSQL_HOST -e MYSQL_DATABASE -e MYSQL_USER -e MYSQL_PASSWORD \
            secury-tablet-api:cold-auth python -m alembic upgrade head
          docker restart render_auth_db >/dev/null
          wait_mysql
          docker run --rm --network render_auth_net \
            -e MYSQL_HOST -e MYSQL_DATABASE -e MYSQL_USER -e MYSQL_PASSWORD \
            secury-tablet-api:cold-auth python -m alembic upgrade head
          docker run --rm --network render_auth_net \
            -e MYSQL_HOST -e MYSQL_DATABASE -e MYSQL_USER -e MYSQL_PASSWORD \
            secury-tablet-api:cold-auth python -m alembic current | grep -q '0004'
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: |
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/history)" = 401
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
