name: Quality

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/unit -q

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: armario_tablets_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-only-password@127.0.0.1:3306/armario_tablets_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/integration -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

  docker:
    runs-on: ubuntu-latest
    needs: [unit, mysql, flutter]
    timeout-minutes: 25
    env:
      MYSQL_DATABASE: armario_tablets
      MYSQL_USER: armario
      MYSQL_PASSWORD: ci-only-app-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-administrator-password
      ADMIN_TOKEN_SECRET: ci-only-signing-secret-with-at-least-32-bytes
      HARDWARE_API_KEY: ci-only-hardware-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: |
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/history)" = 401
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
