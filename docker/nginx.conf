limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rfid:10m rate=30r/m;

# Railway terminates TLS before Nginx. Accept only single, recognized schemes.
map $http_x_forwarded_proto $api_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map $http_host $api_forwarded_host {
    default $http_host;
    "" $host;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    resolver_timeout 3s;
    set $api_backend ${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 128k;
    limit_req_status 429;

    # Shared by every proxy location, including the three login routes.
    proxy_set_header Host $api_forwarded_host;
    proxy_set_header X-Forwarded-Host $api_forwarded_host;
    proxy_set_header X-Forwarded-Proto $api_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/admin/login {
        access_log off;
        limit_req zone=login burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
    }
    location = /api/auth/professor/login {
        access_log off;
        limit_req zone=login burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
    }
    location = /api/auth/rfid {
        access_log off;
        limit_req zone=rfid burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
    }
    location /api/ {
        access_log off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
