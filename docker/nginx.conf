limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rfid:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 128k;
    limit_req_status 429;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/admin/login {
        access_log off;
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://$api_backend/admin/login;
        proxy_set_header Host $host;
    }
    location = /api/auth/rfid {
        access_log off;
        limit_req zone=rfid burst=10 nodelay;
        proxy_pass http://$api_backend/auth/rfid;
        proxy_set_header Host $host;
    }
    location /api/ {
        access_log off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
