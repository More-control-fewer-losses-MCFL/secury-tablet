# Render's Cloudflare overwrites CF-Connecting-IP. A client can forge the
# leftmost X-Forwarded-For entry, so never use that entry for rate limits.
map "${TRUST_CF_CONNECTING_IP}:$http_cf_connecting_ip" $rate_limit_client {
    default $remote_addr;
    ~^true:(?<trusted_client>[0-9A-Fa-f:.]+)$ $trusted_client;
}
limit_req_zone $rate_limit_client zone=login:10m rate=5r/m;
limit_req_zone $rate_limit_client zone=rfid:10m rate=30r/m;

server {
    listen ${PORT};
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    set $api_backend ${API_UPSTREAM};
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 128k;
    limit_req_status 429;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/admin/login {
        access_log off;
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://$api_backend/admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $rate_limit_client;
        proxy_set_header X-Real-IP $rate_limit_client;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
    }
    location = /api/auth/professor/login {
        access_log off;
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://$api_backend/auth/professor/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $rate_limit_client;
        proxy_set_header X-Real-IP $rate_limit_client;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
    }
    location = /api/auth/rfid {
        access_log off;
        limit_req zone=rfid burst=10 nodelay;
        proxy_pass http://$api_backend/auth/rfid;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $rate_limit_client;
        proxy_set_header X-Real-IP $rate_limit_client;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
    }
    location /api/ {
        access_log off;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $rate_limit_client;
        proxy_set_header X-Real-IP $rate_limit_client;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
        proxy_read_timeout 30s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
